name: Helm Chart Package & Publish

on:
  push:
    branches: [ main ]
    paths:
      - 'charts/**'
      - 'values.yml'
      - 'ingress.yml'
      - '.github/workflows/helm-publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: Generate version
      id: version
      run: |
        VERSION="1.0.0"
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

    - name: Update Chart.yaml
      run: |
        sed -i "s/version: .*/version: ${{ steps.version.outputs.version }}/" charts/AgentRAG.io/Chart.yaml
        sed -i "s/appVersion: .*/appVersion: \"${{ steps.version.outputs.version }}\"/" charts/AgentRAG.io/Chart.yaml
        sed -i "s|{{ github_username }}|${{ github.repository_owner }}|g" charts/AgentRAG.io/Chart.yaml
        sed -i "s|{{ github_username }}|${{ github.repository_owner }}|g" charts/AgentRAG.io/values.yaml
        cat charts/AgentRAG.io/Chart.yaml

    - name: Lint Helm chart
      run: helm lint charts/AgentRAG.io

    - name: Package Helm chart
      run: |
        mkdir -p charts
        helm package charts/AgentRAG.io -d charts/
        ls -lah charts/

    - name: Create Helm index
      run: |
        if [ -f charts/index.yaml ]; then
          helm repo index charts/ --url https://${{ github.repository_owner }}.github.io/AgentRAG.io/ --merge charts/index.yaml
        else
          helm repo index charts/ --url https://${{ github.repository_owner }}.github.io/AgentRAG.io/
        fi
        cat charts/index.yaml

    - name: Create documentation
      run: |
        cat > charts/README.md << 'EOF'
        # RAG Multi-Expert Helm Charts
        
        Kubernetes deployment chart for AgentRAG.io - Intelligent RAG with Autonomous Agents.
        
        ## Add Repository
        ```bash
        helm repo add rag https://${{ github.repository_owner }}.github.io/AgentRAG.io/
        helm repo update
        ```
        
        ## Install Chart
        ```bash
        helm upgrade --install agentragio agentragio/agentragio \
          --namespace agentragio \
          --create-namespace \
          -f values.yml
          ```

        ## Values.yaml
        ```yaml

        secrets:
          create: true
          name: rag-secrets
          data:
            DATABASE_URL: "postgresql://raguser:changeMeRag123!@rag-multi-expert-postgres:5432/rag_db"
            POSTGRES_SERVER: "rag-multi-expert-postgres"
            POSTGRES_PORT: "5432"
            POSTGRES_DB: "rag_db"
            POSTGRES_USER: "raguser"
            POSTGRES_PASSWORD: "changeMeRag123!"
            CHROMA_HOST: "rag-multi-expert-chroma"
            CHROMA_PORT: "8001"
            SECRET_KEY: "changeMeSecretKeyForJWT123"
            ENCRYPTION_KEY: "changeMeEncryptionKey123="
            OLLAMA_URL: "http://ollama.default.svc.cluster.local:11434"
            OPENAI_API_KEY: ""
            ANTHROPIC_API_KEY: ""
            # Feature/opeansearchadd
            OPENSEARCH_HOST: "opensearch.domain.local"
            OPENSEARCH_PORT: "9200"
            OPENSEARCH_USER: "admin"
            OPENSEARCH_PASSWORD: "admin"
            OPENSEARCH_USE_SSL: "true"
            OPENSEARCH_VERIFY_CERTS: "false"
            OPENSEARCH_EMBEDDING_DIM: "384"

        ```

        ## Prerequisites
        
        - Kubernetes 1.20+
        - Helm 3.0+
        - Ingress Controller (nginx-ingress)
        - StorageClass configured (local-path or local-storage)
        
        ## Configuration Files (at repo root)
        
        - `values.yml` - Helm values (mandatory)
        - `ingress.yml` - Ingress configuration (optional)
        
        ## Deploy with Generic Ansible Pipeline
        ```bash
        ansible-playbook deploy_helm_generic.yml 

        use: https://github.com/iwebbo/Ansible/tree/main/roles/deploy_helmchart_stack_standalone
        ```
    
        
        ## Architecture
        ```
        ┌─────────────────────────────────────────────────┐
        │              Ingress (Traefik)                    │
        │  rag.local → Frontend (/) + Backend (/api)      │
        └─────────────────────────────────────────────────┘
                     │                    │
        ┌────────────▼──────────┐  ┌─────▼──────────────┐
        │   Frontend (Vue 3)    │  │  Backend (FastAPI) │
        │   Port: 80            │  │  Port: 8000        │
        └───────────────────────┘  └────────────────────┘
                                           │
                    ┌──────────────────────┼──────────────────────┐
                    │                      │                      │
        ┌───────────▼─────────┐ ┌─────────▼────────┐ ┌──────────▼─────────┐
        │  PostgreSQL         │ │  ChromaDB         │ │  Documents (PVC)   │
        │  Port: 5432         │ │  Port: 8001       │ │  Shared Storage    │
        │  PVC: 10Gi          │ │  PVC: 20Gi        │ │  PVC: 50Gi         │
        └─────────────────────┘ └───────────────────┘ └────────────────────┘
        ```

        ## LLM Configuration

        LLM providers are configured via the UI after deployment. The application supports:
        - Ollama (local)
        - OpenAI API
        - Anthropic Claude API

        Documents for each domain should be uploaded via the web interface.
        EOF
        cat charts/README.md

    - name: Checkout gh-pages branch
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: gh-pages
        fetch-depth: 0

    - name: Copy charts to gh-pages
      run: |
        mkdir -p gh-pages
        cp -r charts/* gh-pages/
        ls -lah gh-pages/

    - name: Commit and push to gh-pages
      run: |
        cd gh-pages
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        git commit -m "Publishing Helm chart ${{ steps.version.outputs.version }}" || true
        git push origin gh-pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create deployment summary
      run: |
        echo "## 📦 Helm Chart Published" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Chart Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📍 Repository URL" >> $GITHUB_STEP_SUMMARY
        echo "https://${{ github.repository_owner }}.github.io/AgentRAG.io/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Add Repository" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "helm repo add agentragio https://${{ github.repository_owner }}.github.io/AgentRAG.io/" >> $GITHUB_STEP_SUMMARY
        echo "helm repo update" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 Install" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "helm install agentragio agentragio/agentragio -n agentragio --create-namespace -f values.yml" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY